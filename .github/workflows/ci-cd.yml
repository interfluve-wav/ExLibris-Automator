name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint flake8 black pytest pytest-cov pre-commit

    - name: Install Playwright
      run: |
        python -m playwright install chromium

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Run tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
        CITATION_PARSER: openai
        OPENAI_MODEL: gpt-4o-mini
      run: |
        # Run existing tests
        python test_citations.py || true
        python test_parser_simple.py || true
        python tests/performance_tests.py || true
      continue-on-error: true

    - name: Smoke test - core status flow
      run: |
        python -m unittest tests/test_status_and_standalone.py

    - name: Smoke test - environment validator
      run: |
        python deployment/validate_env.py || true

    - name: Pre-commit checks (including secret scan)
      run: |
        pre-commit run --all-files

    - name: Security check - scan for secrets (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./

  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit

    - name: Check for known vulnerabilities with safety
      run: |
        safety check --file requirements.txt || true
      continue-on-error: true

    - name: Audit dependencies with pip-audit
      run: |
        pip-audit -r requirements.txt || true
      continue-on-error: true

  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run performance benchmarks
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
      run: |
        python tests/performance_tests.py > benchmark_results.txt
        cat benchmark_results.txt
      continue-on-error: true
